<!-- REDIRECIONAMENTO ULTRA-INSTANTÂNEO (Executa no Head em Paralelo antes de desenhar a tela) -->
<script>
(function() {
  try {
    const params = new URLSearchParams(location.search);
    let codigo = (params.get('id') || params.get('codigo') || '').trim().toLowerCase();
    if (!codigo && location.pathname.includes('/p/')){
      const parte = location.pathname.split('/p/')[1];
      if (parte) codigo = decodeURIComponent(parte).split('/')[0].trim().toLowerCase();
    }
    if (!codigo) return;

    let redirecionado = false;
    function redirecionar(url) {
      if (url && !redirecionado) {
        redirecionado = true;
        location.replace(url);
      }
    }

    const t = Date.now();

    // 1. Host local (Vercel)
    fetch('/p/ofertas.json?t=' + t, { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && data[codigo]) {
          const o = data[codigo];
          redirecionar(typeof o === 'string' ? o : (o.url || null));
        }
      }).catch(() => {});

    // 2. GitHub Raw em tempo real
    fetch('https://raw.githubusercontent.com/MjuniorFacic/paizao-site/main/p/ofertas.json?t=' + t, { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && data[codigo]) {
          const o = data[codigo];
          redirecionar(typeof o === 'string' ? o : (o.url || null));
        }
      }).catch(() => {});

    // 3. API Oficial do GitHub (zero cache)
    fetch('https://api.github.com/repos/MjuniorFacic/paizao-site/contents/p/ofertas.json?t=' + t)
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && data.content) {
          const decoded = decodeURIComponent(atob(data.content.replace(/\s/g, '')).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
          const ofertas = JSON.parse(decoded);
          if (ofertas && ofertas[codigo]) {
            const o = ofertas[codigo];
            redirecionar(typeof o === 'string' ? o : (o.url || null));
          }
        }
      }).catch(() => {});

  } catch(e) {}
})();
</script>

<style>
  body { opacity: 0; transition: opacity 0.15s; }
  body.visivel { opacity: 1; }
  /* ===== PALETA OFICIAL — consistente com a página de grupos ===== */
  :root{
    --navy:#002456;        /* azul da marca            */
    --navy-2:#0A3374;      /* azul claro (gradiente)   */
    --amarelo:#FECB02;     /* amarelo da marca         */
    --amarelo-2:#FFDC57;   /* amarelo claro            */
    --whats:#25D366;       /* verde do WhatsApp        */

    --bg:#f5f6f9;
    --card:#ffffff;
    --txt:#111c33;
    --txt2:#6d7793;
    --borda:#e2e6ef;
    --raio:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--txt);line-height:1.5;
    min-height:100vh;display:flex;flex-direction:column;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;width:100%}

  /* ---------- HEADER ---------- */
  header{
    background:linear-gradient(165deg,var(--navy-2) 0%,var(--navy) 62%,#001736 100%);
    color:#fff;padding:26px 0 30px;text-align:center;
    border-radius:0 0 26px 26px;
  }
  .logo{
    width:96px;height:96px;border-radius:50%;overflow:hidden;margin:0 auto;
    box-shadow:0 10px 30px rgba(0,0,0,.38);
  }
  .logo img{width:100%;height:100%;object-fit:cover;display:block}
  header p{font-size:13.5px;opacity:.88;margin-top:13px}

  /* ---------- CARD PRINCIPAL ---------- */
  .card{
    background:var(--card);border:1px solid var(--borda);border-radius:var(--raio);
    padding:34px 22px;text-align:center;margin-top:26px;
    box-shadow:0 4px 18px rgba(0,36,86,.06);
  }

  /* ---------- SPINNER DE CARREGAMENTO ---------- */
  .spinner{
    width:52px;height:52px;margin:0 auto 18px;border-radius:50%;
    border:4px solid #e4e9f3;border-top-color:var(--navy);
    animation:girar .9s linear infinite;
  }
  @keyframes girar{to{transform:rotate(360deg)}}
  .spinner.whats{border-top-color:var(--whats)}
  .spinner.amarelo{border-top-color:var(--amarelo)}

  .card h2{font-size:19px;font-weight:800;letter-spacing:-.3px}
  .card p{font-size:13.5px;color:var(--txt2);margin-top:6px}
  .card .dica{font-size:11.5px;color:var(--txt2);margin-top:16px;opacity:.8}

  /* ---------- ESTADO: OFERTA ENCERRADA ---------- */
  .icone-encerrada{
    width:64px;height:64px;border-radius:50%;margin:0 auto 16px;
    background:var(--navy);color:var(--amarelo);
    display:flex;align-items:center;justify-content:center;font-size:28px;
  }
  .btn-voltar{
    display:block;margin-top:20px;background:var(--amarelo);color:var(--navy);
    font-size:15.5px;font-weight:800;text-align:center;
    padding:15px;border-radius:12px;text-decoration:none;
    box-shadow:0 6px 18px rgba(0,36,86,.26);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn-voltar:active{transform:scale(.975);box-shadow:0 4px 12px rgba(0,36,86,.2)}

  /* ---------- RODAPÉ ---------- */
  footer{text-align:center;padding:26px 16px 14px;font-size:11.5px;color:var(--txt2);line-height:1.6;margin-top:auto}
  footer strong{display:block;color:var(--navy);font-size:12px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">
      <img src="../assets/logo.png" width="192" height="192"
           alt="Paizão dos Descontos — O Paizão achou, você economiza!">
    </div>
    <p>Paizão dos Descontos</p>
  </div>
</header>

<div class="wrap">
  <div class="card" id="estado">
    <!-- Preenchido via JavaScript (carregando / oferta encerrada) -->
    <div class="spinner"></div>
    <h2>Abrindo a oferta...</h2>
    <p>Se não abrir automaticamente, clique no botão abaixo.</p>
    <div class="dica">Você será redirecionado em instantes</div>
  </div>
</div>

<footer>
  <div class="wrap">
    <strong>👨‍👧‍👦 PAIZÃO DOS DESCONTOS</strong>
    Participamos de programas de afiliados. Preços e disponibilidade sujeitos a alteração pelas lojas.
  </div>
</footer>

<script>
/* ==================================================================
   CONFIGURAÇÃO — é só aqui que você mexe.

   Adicione suas ofertas no objeto OFERTAS:
     { codigo: "nome-oferta", url: "https://link-afiliado" }

   - codigo:  fica na URL limpa (/p/codigo) e na query (?id=codigo)
   - url:     para onde a pessoa é redirecionada (link de afiliado,
              link da loja, link do grupo, etc.)

   Exemplos:
     "fritadeira-11l":  { url: "https://mercadolivre.com.br/..." },
     "tenis-nike":      { url: "https://shope.ee/..." },
     "cupom-10":        { url: "https://amzn.to/..." }
   ================================================================== */
const OFERTAS_LOCAIS = {
  "lixeira-sensor": { url: "https://meli.la/32c6vC8" },
  "mercado-livre": { url: "https://meli.la/32c6vC8" }
};

const $ = s => document.querySelector(s);
const card = $('#estado');

/* ---------- DESCOBRE O CÓDIGO DA OFERTA ---------- */
const params = new URLSearchParams(location.search);
let codigo = (params.get('id') || params.get('codigo') || '').trim().toLowerCase();

if (!codigo && location.pathname.includes('/p/')){
  const parte = location.pathname.split('/p/')[1];
  if (parte) codigo = decodeURIComponent(parte).split('/')[0].trim().toLowerCase();
}

async function carregarOfertas(){
  let ofertas = Object.assign({}, OFERTAS_LOCAIS);
  // 1. Tenta pegar de /p/ofertas.json local (com caminho absoluto)
  try {
    const res = await fetch('/p/ofertas.json?t=' + Date.now(), { cache: 'no-store' });
    if (res.ok) {
      const dados = await res.json();
      ofertas = Object.assign(ofertas, dados);
    }
  } catch (e) {}

  // 2. Se a oferta específica não estiver no arquivo local, busca no GitHub Raw em tempo real
  if (!ofertas[codigo]) {
    try {
      const resGh = await fetch('https://raw.githubusercontent.com/MjuniorFacic/paizao-site/main/p/ofertas.json?t=' + Date.now(), { cache: 'no-store' });
      if (resGh.ok) {
        const dadosGh = await resGh.json();
        ofertas = Object.assign(ofertas, dadosGh);
      }
    } catch (e) {}
  }

  // 3. Fallback direto da API do GitHub (zero cache)
  if (!ofertas[codigo]) {
    try {
      const resApi = await fetch('https://api.github.com/repos/MjuniorFacic/paizao-site/contents/p/ofertas.json?t=' + Date.now());
      if (resApi.ok) {
        const dataApi = await resApi.json();
        const decoded = decodeURIComponent(atob(dataApi.content.replace(/\s/g, '')).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        const dadosApi = JSON.parse(decoded);
        ofertas = Object.assign(ofertas, dadosApi);
      }
    } catch (e) {}
  }

  return ofertas;
}

/* ---------- REDIRECIONA ---------- */
async function processar(){
  if (!codigo) {
    document.body.classList.add('visivel');
    card.innerHTML = `
      <div class="icone-encerrada">×</div>
      <h2>Oferta Não Encontrada</h2>
      <p>Nenhuma oferta foi informada no link.</p>
      <p style="margin-top:4px">Mas as promoções continuam rolando nos grupos do WhatsApp 👇</p>
      <a href="../grupos/" class="btn-voltar">Ver ofertas nos grupos →</a>`;
    return;
  }

  const ofertas = await carregarOfertas();
  const oferta = ofertas[codigo];
  const urlFinal = (typeof oferta === 'string') ? oferta : (oferta && oferta.url ? oferta.url : null);

  if (urlFinal){
    window.location.replace(urlFinal);
    return;
  } else {
    /* ---------- OFERTA ENCERRADA / NÃO ENCONTRADA ---------- */
    document.body.classList.add('visivel');
    card.innerHTML = `
      <div class="icone-encerrada">×</div>
      <h2>Oferta Encerrada</h2>
      <p>Essa oferta não existe mais ou o link foi atualizado.</p>
      <p style="margin-top:4px">Mas as promoções continuam rolando nos grupos do WhatsApp 👇</p>
      <a href="../grupos/" class="btn-voltar">Ver ofertas nos grupos →</a>`;
  }
}

processar();
</script>
</body>
</html>
